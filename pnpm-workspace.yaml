allowBuilds:
  esbuild: true
# pnpm 11 no longer reads the `pnpm` field of package.json; settings live here.
# The patch teaches dsh-log-contract (0.3.17, still v3-only upstream) the v4
# session-format rules that DSH 0.2.0-rc.1 writes, so the plugin's pre-write
# guard can validate v4 sessions instead of rejecting every marker write.
patchedDependencies:
  dsh-log-contract@0.3.17: patches/dsh-log-contract@0.3.17.patch
minimumReleaseAgeExclude:
  - dsh-log-contract@0.1.0
  - dsh-log-contract@0.3.12
  - '@deepseek-ai/dsh-agent@0.2.0-rc.1'
  - '@deepseek-ai/dsh-attachment@0.2.0-rc.1'
  - '@deepseek-ai/dsh-brand@0.2.0-rc.1'
  - '@deepseek-ai/dsh-client-locale@0.2.0-rc.1'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.0-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.0-rc.1'
  - '@deepseek-ai/dsh-commands@0.2.0-rc.1'
  - '@deepseek-ai/dsh-compaction-image-offload@0.2.0-rc.1'
  - '@deepseek-ai/dsh-compaction@0.2.0-rc.1'
  - '@deepseek-ai/dsh-invariants@0.2.0-rc.1'
  - '@deepseek-ai/dsh-llm-retry@0.2.0-rc.1'
  - '@deepseek-ai/dsh-llm@0.2.0-rc.1'
  - '@deepseek-ai/dsh-scope@0.2.0-rc.1'
  - '@deepseek-ai/dsh-session-projection@0.2.0-rc.1'
  - '@deepseek-ai/dsh-session@0.2.0-rc.1'
  - '@deepseek-ai/dsh-storage-domain@0.2.0-rc.1'
  - '@deepseek-ai/dsh-storage@0.2.0-rc.1'
  - '@deepseek-ai/dsh-system-prompt@0.2.0-rc.1'
  - '@deepseek-ai/dsh-timeout@0.2.0-rc.1'
  - '@deepseek-ai/dsh-token-meter@0.2.0-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.2.0-rc.1'
  - '@deepseek-ai/dsh-util-crypto@0.2.0-rc.1'
  - '@deepseek-ai/dsh-util-values@0.2.0-rc.1'
